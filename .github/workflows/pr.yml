name: Checks

# What a contributor gets told before anybody looks at their branch.
#
# Five pull requests arrived from forks before this existed, so the only checks
# that ever ran on them were the ones a maintainer remembered to run by hand.
#
# Also on pushes to main, because a change that lands without a pull request
# should not be the one nobody checked.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A second push supersedes its own run rather than queuing behind it.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm install`, not `npm ci`. The committed lock records the optional
      # platform binaries for one platform only, so `npm ci` cannot resolve
      # `@esbuild/linux-x64` here and refuses to install anything. Installing
      # resolves them for whatever this is running on. The lock still decides
      # the versions; only the missing platform entries are filled in, and the
      # lock this writes is thrown away with the runner.
      - run: npm install --no-audit --no-fund

      - name: Formatting
        run: npm run lint

      - name: Types
        run: npx tsc --noEmit

      # `test:dep`, `test:npm`, `test:payable`, `test:ping` and `test:stats`
      # read the chain and a package registry. Each skips its network half when
      # there is no connection, so an outage upstream degrades the suite rather
      # than failing it.
      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  contracts:
    # Only when they change. SmartPy needs Python and the scenarios take
    # minutes, which is a long time to sit in front of a documentation fix.
    # The job always starts, because a skipped job cannot be a required check;
    # it costs one git diff to find out it has nothing to do.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Did the contracts change?
        id: changed
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base" HEAD | grep -q '^contract/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.changed.outputs.run == 'true'
        with:
          python-version: "3.12"

      # `smartpy-tezos`, not `smartpy`. The bare name on PyPI belongs to an
      # unrelated hydrology model, which installs happily and then has no
      # `sp.entrypoint` for the scenarios to call.
      - name: Install SmartPy
        if: steps.changed.outputs.run == 'true'
        run: pip install smartpy-tezos

      - name: Scenarios
        if: steps.changed.outputs.run == 'true'
        run: npm run test:contracts
