name: Something is broken
description: A thing that does not do what it says
labels: [bug]
body:
    - type: markdown
      attributes:
          value: |
              If this is a security problem, do not file it here. See
              [SECURITY.md](https://github.com/skullzarmy/aleatory/blob/main/SECURITY.md).

    - type: textarea
      id: what
      attributes:
          label: What happened
          description: What you saw, and what you expected instead.
      validations:
          required: true

    - type: textarea
      id: steps
      attributes:
          label: How to see it
          description: |
              The steps, in order. A URL is worth more than a description of
              one, and an operation hash or a contract address is worth more
              than either.
          placeholder: |
              1. Open /collection/KT1…
              2. Mint with the palette set to Ember
              3. The page shows Seeded
      validations:
          required: true

    - type: input
      id: where
      attributes:
          label: Where
          description: The site, the studio, the provider, the bot, the contracts.
          placeholder: shadownet.aleatory.art, Firefox

    - type: textarea
      id: console
      attributes:
          label: Anything in the console
          description: Pasted, not screenshotted, so it can be searched.
          render: text
